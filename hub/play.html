<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>플레이 — 캠피싱 KREFT</title>
<meta name="description" content="캠피싱 KREFT 낚시게임 플레이">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#d4af37; --ink:#0b1a22; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#07131a;color:#eaf4f8;
    font-family:"Noto Sans KR",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}

  .pbar{flex:none;display:flex;align-items:center;gap:14px;height:48px;
    padding:0 16px;background:linear-gradient(180deg,#0b1a22,#123645);
    border-bottom:1px solid rgba(255,255,255,.07)}
  .pbar a.home{display:flex;align-items:center;gap:7px;color:#cfe1e8;
    text-decoration:none;font-weight:700;font-size:14px}
  .pbar a.home:hover{color:#fff}
  .pbar .nick{margin-left:auto;color:var(--gold);font-weight:700;font-size:13.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
  .pbar button{background:rgba(255,255,255,.08);border:none;color:#cfe1e8;
    font-family:inherit;font-weight:700;font-size:13px;padding:7px 13px;
    border-radius:8px;cursor:pointer;white-space:nowrap}
  .pbar button:hover{background:rgba(255,255,255,.16);color:#fff}

  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:10px;background:
      radial-gradient(ellipse 70% 60% at 50% 40%, rgba(47,184,230,.08), transparent 70%),#07131a}
  .frame{width:100%;max-width:calc((100vh - 68px) * 16 / 9);aspect-ratio:16/9;
    max-height:100%;border-radius:12px;overflow:hidden;background:#000;
    box-shadow:0 18px 60px rgba(0,0,0,.55)}
  .frame iframe{width:100%;height:100%;border:0;display:block}

  /* 로딩 / 로그인 안내 */
  .panel{text-align:center;padding:40px 26px;max-width:460px}
  .panel .sp{width:42px;height:42px;margin:0 auto 20px;border-radius:50%;
    border:3px solid rgba(255,255,255,.14);border-top-color:var(--gold);
    animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .panel h2{margin:0 0 12px;font-size:21px;font-weight:900}
  .panel p{margin:0 0 22px;color:#9fbecb;font-size:14.5px;line-height:1.8}
  .panel .btn{display:inline-block;padding:13px 30px;border-radius:30px;
    background:linear-gradient(135deg,#ffd23f,#e9b219);color:#4a3200;
    font-weight:900;font-size:15px;text-decoration:none;border:none;
    cursor:pointer;font-family:inherit}
  .panel .btn:hover{filter:brightness(1.06)}
  .panel .sub{display:block;margin-top:16px;color:#7f9dab;font-size:13px;text-decoration:none}
  .panel .sub:hover{color:#cfe1e8}

  @media (max-width:760px){
    .pbar{height:44px;padding:0 11px;gap:9px}
    .pbar a.home span{display:none}
    .pbar .nick{font-size:12.5px}
    .stage{padding:0}
    .frame{border-radius:0;max-width:100%}
  }
</style>
</head>
<body>

<div class="pbar">
  <a class="home" href="index.html">← <span>캠피싱 KREFT</span></a>
  <span class="nick" data-auth-in style="display:none" data-me-nick></span>
  <button id="fsBtn" title="전체화면">⛶ 전체화면</button>
</div>

<div class="stage" id="stage">
  <div class="panel" id="panel">
    <div class="sp"></div>
    <h2>게임을 준비하고 있어요</h2>
    <p>잠시만 기다려 주세요…</p>
  </div>
</div>

<script>
  var GAME_ORIGIN = 'https://camnak-fishing.web.app';
  var LOGIN_URL   = 'https://camnak.com/?gohub=1';
  var launched = false;

  function panel(html){ document.getElementById('panel').innerHTML = html; }

  // 🎮 게임 띄우기 — 이메일은 iframe 주소 안에만 들어가므로 주소창에 노출되지 않음
  function launch(email){
    if (launched) return;
    launched = true;
    var st = document.getElementById('stage');
    st.innerHTML = '<div class="frame"><iframe id="gameFrame" allow="autoplay; fullscreen"'
      + ' allowfullscreen src="' + GAME_ORIGIN + '/?uid=' + encodeURIComponent(email) + '"></iframe></div>';
  }

  function askLogin(){
    if (launched) return;
    panel('<h2>로그인이 필요해요</h2>'
      + '<p>캠피싱 회원으로 로그인하시면<br>내 조사님으로 바로 이어서 낚시할 수 있어요.</p>'
      + '<a class="btn" href="' + LOGIN_URL + '">로그인하고 시작하기</a>'
      + '<a class="sub" href="index.html">홈으로 돌아가기</a>');
  }

  // 로그인되면(auth.js가 알려줌) 바로 실행
  document.addEventListener('camfishing:login', function(e){
    var em = (e.detail && e.detail.email) ||
             (window.__auth && window.__auth.currentUser && window.__auth.currentUser.email);
    if (em) launch(em);
  });

  // auth.js 로드 전/후 모두 대비 — 이미 로그인 상태면 바로 잡아서 실행
  var tries = 0;
  var poll = setInterval(function(){
    var u = window.__auth && window.__auth.currentUser;
    if (u && u.email){ clearInterval(poll); launch(u.email); return; }
    if (++tries > 24){ clearInterval(poll); askLogin(); }   // 약 6초
  }, 250);

  // 전체화면
  document.getElementById('fsBtn').onclick = function(){
    var el = document.querySelector('.frame') || document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  };
</script>
<script type="module" src="auth.js"></script>
</body>
</html>
