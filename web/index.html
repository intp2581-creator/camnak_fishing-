<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- 📱 폰에서 실제 화면 폭에 맞춰 또렷하게 그리도록(없으면 980px 가정해 흐려진다) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="camnak_fishing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>camnak_fishing</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
   <script>
      /* ⚠️ 이 설정은 요즘 Flutter 에서 없어졌다 — 아무 효과가 없다.
         실제로는 CanvasKit(WebGL)로 그린다(build/web/canvaskit.wasm).
         아래 화면 복구 코드가 필요한 이유다. */
      window.flutterWebRenderer = "html";
    </script>

  <script>
  /* 화면이 멈추면 스스로 다시 불러온다 — WebGL 컨텍스트 끊김 대응.
     CanvasKit 는 WebGL 캔버스에 그리는데, 탭을 오래 백그라운드에 두면
     브라우저가 GPU 메모리를 회수하며 컨텍스트를 끊는다. 그 뒤로는 화면이
     하얗게 멈추고 Flutter 는 스스로 복구하지 못한다(2026-09-07 제보). */
  (function () {
    var busy = false;

    function recover() {
      if (busy) return;
      busy = true;
      try {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;'
          + 'align-items:center;justify-content:center;background:#101010;'
          + 'font-family:system-ui,-apple-system,\'Noto Sans KR\',sans-serif';
        d.innerHTML = '<div style="text-align:center;color:#D4AF37;padding:24px">'
          + '<div style="font-size:34px;margin-bottom:12px">\uD83C\uDFA3</div>'
          + '<div style="font-size:17px;font-weight:700;margin-bottom:8px">'
          + '화면을 다시 불러옵니다</div>'
          + '<div style="font-size:14px;color:#bbb;line-height:1.6">'
          + '잠시만 기다려 주세요.<br>진행하시던 내용은 그대로 있습니다.</div></div>';
        document.body.appendChild(d);
      } catch (_) {}
      setTimeout(function () {
        try { location.reload(); } catch (_) { location.href = location.href; }
      }, 1200);
    }

    /* 캔버스에서 바로 올라오는 경우 — 캡처 단계라 이벤트가 버블링하지 않아도 잡힌다. */
    window.addEventListener('webglcontextlost', function (e) {
      try { e.preventDefault(); } catch (_) {}
      recover();
    }, true);

    /* Flutter 는 캔버스를 shadow DOM 안에 만든다. 그 안에서 난 이벤트는
       바깥까지 안 나오는 경우가 있어, 캔버스를 찾아 직접 붙여 둔다.
       캔버스는 실행 중에 새로 생기기도 하므로 주기적으로 훑는다. */
    var seen = new WeakSet();
    function attach(root) {
      var list;
      try { list = root.querySelectorAll('canvas'); } catch (_) { return; }
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (seen.has(c)) continue;
        seen.add(c);
        c.addEventListener('webglcontextlost', function (e) {
          try { e.preventDefault(); } catch (_) {}
          recover();
        });
      }
      var all;
      try { all = root.querySelectorAll('*'); } catch (_) { return; }
      for (var k = 0; k < all.length; k++) {
        if (all[k].shadowRoot) attach(all[k].shadowRoot);   // 열린 shadow root 만
      }
    }
    setInterval(function () { if (!busy) attach(document); }, 4000);

    /* 돌아왔는데 컨텍스트가 이미 죽어 있는 경우 — 이벤트를 놓쳤을 수 있다.
       탭이 다시 보일 때 한 번 물어본다. */
    document.addEventListener('visibilitychange', function () {
      if (document.hidden || busy) return;
      setTimeout(function () {
        var dead = false;
        function scan(root) {
          var list;
          try { list = root.querySelectorAll('canvas'); } catch (_) { return; }
          for (var i = 0; i < list.length; i++) {
            try {
              var gl = list[i].getContext('webgl2') || list[i].getContext('webgl');
              if (gl && gl.isContextLost()) dead = true;
            } catch (_) {}
          }
          var all;
          try { all = root.querySelectorAll('*'); } catch (_) { return; }
          for (var k = 0; k < all.length; k++) {
            if (all[k].shadowRoot) scan(all[k].shadowRoot);
          }
        }
        scan(document);
        if (dead) recover();
      }, 600);
    });
  })();
  </script>
   <script src="flutter_bootstrap.js?v=1.0.1" async></script>
  </body>
</html>
